<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>пользователь нейрографики · kintsugi*</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --vanilla: #f1eada; --mahogany: #584738; --gold: #c9a96e; --gold-light: #e8d5a8; }
    html { scroll-behavior: smooth; }
    body { background: var(--vanilla); color: var(--mahogany); font-family: 'Georgia', serif; font-size: 17px; line-height: 1.8; }
    
    /* Навигация и блоки */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--vanilla); border-bottom: 1px solid var(--gold-light); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 2rem; }
    section { padding-top: 96px; padding-bottom: 72px; border-bottom: 1px solid var(--gold-light); }
    
    /* Стили для практики */
    .practice-block { margin-top: 3rem; padding: 2rem; border: 1px solid var(--gold-light); background: rgba(255,255,255,0.4); border-radius: 4px; }
    .btn-download { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.5rem; background: var(--gold); color: var(--vanilla); text-decoration: none; font-size: 14px; letter-spacing: 0.1em; border-radius: 2px; }
    
    /* Остальные стили из твоего макета (упрощено для компактности) */
    .hero { padding-top: 140px; text-align: center; }
    h1 { font-size: 3rem; font-weight: normal; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="#">kintsugi*</a>
</nav>

<section class="hero" id="hero">
  <div class="container">
    <h1>пользователь нейрографики</h1>
    
    <div class="practice-block">
      <h3>практика недели</h3>
      <p style="margin-bottom: 1rem;">аудио-практика заземления</p>

      <audio controls style="width: 100%; margin-bottom: 1rem;">
        <source src="ВСТАВЬ_СЮДА_ПРЯМУЮ_ССЫЛКУ_НА_АУДИО.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
      </audio>

      <br>
      <a href="2.стратегии-адаптации-kintsugi.pdf" download class="btn-download">
        скачать конспект
      </a>
    </div>
  </div>
</section>

</body>
</html>

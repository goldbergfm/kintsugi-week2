<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kintsugi* · стратегии адаптации · неделя 2</title>
    <style>
        /* Весь твой оригинальный дизайн сохранен */
        :root {
            --bg-vanilla: #f1eada;
            --text-mahogany: #584738;
            --accent-gold: #c9a96e;
            --border-soft: rgba(88, 71, 56, 0.15);
            --bg-card: rgba(88, 71, 56, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-transform: lowercase; }

        body { background-color: var(--bg-vanilla); color: var(--text-mahogany); line-height: 1.8; padding: 40px 24px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }

        .poster-container { width: 100%; max-width: 760px; background-color: var(--bg-vanilla); border: 1px solid var(--border-soft); padding: 60px 48px; display: flex; flex-direction: column; gap: 50px; position: relative; box-shadow: 0 12px 40px rgba(88, 71, 56, 0.05); border-radius: 4px; }

        @media (max-width: 600px) { body { padding: 16px 8px; } .poster-container { padding: 40px 20px; gap: 40px; } }

        header { border-bottom: 1px solid var(--border-soft); padding-bottom: 30px; text-align: center; }
        .brand-meta { font-size: 0.85rem; letter-spacing: 0.2em; opacity: 0.7; margin-bottom: 12px; }
        h1 { font-size: 2.2rem; font-weight: 300; letter-spacing: -0.02em; line-height: 1.2; color: var(--text-mahogany); margin-bottom: 8px; }
        .subtitle { font-size: 1.1rem; letter-spacing: 0.05em; opacity: 0.8; }
        .manifesto-box { text-align: center; max-width: 600px; margin: 0 auto; }
        .manifesto-lead { font-size: 1.25rem; font-weight: 400; line-height: 1.6; margin-bottom: 12px; }
        .manifesto-sub { font-size: 0.95rem; opacity: 0.65; }
        .reaction-flow { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 6px; padding: 30px; }
        .flow-title { font-size: 0.9rem; letter-spacing: 0.1em; opacity: 0.8; margin-bottom: 24px; text-align: center; border-bottom: 1px solid var(--border-soft); padding-bottom: 10px; }
        .flow-grid { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 16px; text-align: center; }
        .flow-card { padding: 16px; border-radius: 4px; background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(88, 71, 56, 0.05); }
        .flow-step { font-size: 0.75rem; letter-spacing: 0.1em; opacity: 0.5; margin-bottom: 8px; }
        .flow-name { font-size: 1rem; font-weight: 500; margin-bottom: 6px; }
        .flow-desc { font-size: 0.85rem; opacity: 0.7; line-height: 1.4; }
        .flow-arrow { font-size: 1.5rem; color: var(--accent-gold); opacity: 0.8; }
        .strategies-section { display: flex; flex-direction: column; gap: 24px; }
        .section-label { font-size: 0.9rem; letter-spacing: 0.15em; opacity: 0.8; border-bottom: 1px solid var(--border-soft); padding-bottom: 12px; margin-bottom: 8px; }
        .strategy-row { display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 20px 0; border-bottom: 1px dashed var(--border-soft); }
        .strategy-title { font-size: 1.2rem; font-weight: 500; }
        .strategy-meta { font-size: 0.75rem; color: var(--accent-gold); }
        .strategy-details { display: flex; flex-direction: column; gap: 12px; }
        .detail-item { font-size: 0.95rem; }
        .detail-item strong { font-weight: 500; opacity: 0.7; width: 75px; display: inline-block; }
        .price-box { background: rgba(199, 169, 110, 0.08); border-left: 2px solid var(--accent-gold); padding: 24px 30px; border-radius: 0 6px 6px 0; }
        .price-title { font-size: 1rem; letter-spacing: 0.1em; margin-bottom: 12px; font-weight: 500; }
        .price-list { list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 0.95rem; opacity: 0.85; }
        .price-list li::before { content: "·"; color: var(--accent-gold); font-weight: bold; padding-right: 8px; }
        .questions-box { display: flex; flex-direction: column; gap: 20px; }
        .question-item { display: flex; gap: 20px; align-items: flex-start; }
        .question-num { font-size: 0.9rem; font-weight: 500; color: var(--accent-gold); }
        .practice-container { border: 1px solid var(--border-soft); border-radius: 6px; padding: 30px; text-align: center; background: var(--bg-card); display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .practice-title { font-size: 1.1rem; letter-spacing: 0.1em; font-weight: 400; }
        .audio-player { width: 100%; max-width: 480px; background: white; border: 1px solid var(--border-soft); padding: 16px 24px; border-radius: 40px; display: flex; align-items: center; gap: 20px; margin-top: 8px; }
        .btn-download { display: inline-block; margin-top: 15px; padding: 12px 24px; border: 1px solid var(--accent-gold); color: var(--text-mahogany); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.1em; }
        footer { border-top: 1px solid var(--border-soft); padding-top: 35px; text-align: center; }
    </style>
</head>
<body>
    <div class="poster-container">
        <header>
            <div class="brand-meta">виктория голдберг · kintsugi* · неделя 2</div>
            <h1>стратегии адаптации</h1>
            <div class="subtitle">бей · беги · замри · угодничество</div>
        </header>

        <section class="practice-container">
            <div class="practice-title">аудио-практика заземления</div>
            
            <audio controls style="width: 100%; margin-top: 15px;">
                <source src="ВСТАВЬ_ССЫЛКУ_НА_АУДИО.mp3" type="audio/mpeg">
            </audio>

            <a href="2.стратегии-адаптации-kintsugi.pdf" download class="btn-download">
                скачать конспект недели
            </a>
        </section>

        <footer>
            <div class="footer-quote">первый шаг — не изменить. первый шаг — заметить.</div>
            <div class="footer-meta">kintsugi* · неделя 2 завершена</div>
        </footer>
    </div>
</body>
</html>
